<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure 2FA System</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --error: #e74c3c;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --background: #f5f5f5;
            --card-bg: #ffffff;
            --border: #ecf0f1;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }
        
        .auth-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 1.75rem;
            font-weight: 600;
            font-size: 1.75rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        input {
            width: 100%;
            padding: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        button {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }
        
        button:hover {
            background-color: var(--primary-hover);
        }
        
        .links {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.95rem;
        }
        
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .error {
            color: var(--error);
            text-align: center;
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            background-color: rgba(231, 76, 60, 0.1);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.75rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Secure Login</h1>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div class="links">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
            <p><a href="#">Forgot password?</a></p> <!-- Optional -->
        </div>
    </div>
</body>
</html>
